name: customer_voice_demo
description: Caresoft customer voice Flutter integration demo for Android and iOS.
publish_to: none
version: 0.5.0+1
environment:
  sdk: '>=3.14.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  caresoft_customer_voice:
    path: vendor/caresoft_customer_voice-0.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - lib/voice_config.json
